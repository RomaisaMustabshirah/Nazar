name: Build Nazar.exe

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    tags: ["v*"]            # pushing a tag like v2.0.0 also publishes a Release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Nazar
          --icon assets\nazar.ico --add-data "assets;assets"
          --collect-all mediapipe run_nazar.py

      - name: Smoke check
        shell: pwsh
        run: if (!(Test-Path dist\Nazar\Nazar.exe)) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Nazar -DestinationPath Nazar-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Nazar-windows
          path: Nazar-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Nazar-windows.zip
